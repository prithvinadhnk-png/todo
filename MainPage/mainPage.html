<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do | Home</title>
    <link rel="stylesheet" href="../GlobalStyle.css">
    <link rel="stylesheet" href="mainPage.css">
    <link rel="icon" type="image/png" href="../assets/images/list.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.cdnfonts.com/css/nagaiya" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/magic-growing" rel="stylesheet">
</head>

<body class="firstPage">
    <!-- menubar -->
    <div class="row g-0 ">
        <div class="d-flex flex-column menubar pe-3 ps-3 pt-3  min-vh-100 col-2 ">
            <!--Menu Bar Heading-->
            <div class="row">
                <h1 class="navfont text-start magic-growing col-12">
                    To-Do
                </h1>
            </div>

            <!--Search Bar-->
            <div class="row">
                <div class="input-container">
                    <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="#ffffff67"
                        class="bi bi-search " viewBox="0 0 16 16" id="search-icon">
                        <path
                            d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
                    </svg>
                    <input type="text" class="menuSearch" placeholder="Search....">
                </div>
            </div>

            <hr>

            <!--Menu Icons-->
            <div class="row nag">
                <!--Menu Heading-->
                <p style="font-size: 1.2rem; font-weight: 900;color: rgba(255, 255, 255, 0.527);">Menu</p>
                <div class="row g-0 text-center p" style=" border-bottom: 1px solid rgba(255, 255, 255, 0.527);">
                    <!--Menu icons-->
                    <div class="col-6 pt-3 px-1" style=" border-right: 1px solid rgba(255, 255, 255, 0.527);">
                        <i class="bi bi-plus-circle  menu-icons"></i>
                        <p style="margin-top: -1rem;" class="menu-text">add task</p>
                    </div>
                    <div class="col-6 pt-3 px-1">
                        <i class="bi bi-pencil-square  menu-icons"></i>
                        <p style="margin-top: -1rem;" class="menu-text">edit tasks</p>
                    </div>
                </div>
                <div class="row g-0 text-center pt-0">
                    <!--Menu icons row number 2-->
                    <div class="col-6 pt-3 px-1" style=" border-right: 1px solid rgba(255, 255, 255, 0.527);">
                        <i class="bi bi-stopwatch menu-icons"></i>
                        <p style="margin-top: -1rem;" class="menu-text">pomodoro</p>
                    </div>
                    <div class="col-6 pt-3 px-3">
                        <i class="bi bi-bell menu-icons"></i>
                        <p style="margin-top: -1rem;" class="menu-text w-100" style="font-size: 10rem !important;">notification</p>
                    </div>
                </div>
            </div>




        </div>
    </div>






    <script src="https://cdn.jsdelivr.net/npm/animejs/dist/bundles/anime.umd.min.js"></script>
    <script src="mainPage.js" type="module"></script>


    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
</body>

</html>
