<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do | Home</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/theme-toggles@4.10.1/css/eclipse.css"
        integrity="sha256-xBmrwsmxSwonoyqTVOBISgOfgUlBmMgNZ7VneZ20SWc=" crossorigin="anonymous">
    <link rel="stylesheet" href="../GlobalStyle.css">
    <link rel="stylesheet" href="mainPage.css">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-thin-rounded/css/uicons-thin-rounded.css'>

    <link rel="icon" type="image/png" href="../assets/images/list.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.cdnfonts.com/css/nagaiya" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/magic-growing" rel="stylesheet">
</head>
<style>
    :root {
        /* Inner shadow */
        --shadow-offset: 0;
        --shadow-blur: 10px;
        --shadow-spread: -5px;
        --shadow-color: rgba(0, 0, 0, 0.7);

        /* Painted glass */
        --tint-color: 255, 255, 255;
        --tint-opacity: 0.1;

        /* Background frost */
        --frost-blur: 2.5px;

        /* SVG noise/distortion */
        --noise-frequency: 0.008;
        --distortion-strength: 77;

        /* Outer shadow blur */
        --outer-shadow-blur: 24px;
    }

    .glassDiv,
    .glassDivFortask {
        position: relative;
        border-radius: 28px;
        z-index: 1000;
        /* enable pointer dragging on touch */
        box-shadow: 0px 6px var(--outer-shadow-blur) rgba(0, 0, 0, 0.2);
    }

    .glassDiv::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 0;
        border-radius: 28px;
        box-shadow:
            inset var(--shadow-offset) var(--shadow-offset) var(--shadow-blur) var(--shadow-spread) var(--shadow-color);
        background-color: rgba(var(--tint-color), var(--tint-opacity));
    }

    .glassDivFortask::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 0;
        border-radius: 28px;
        box-shadow:
            inset var(--shadow-offset) var(--shadow-offset) var(--shadow-blur) var(--shadow-spread) var(--shadow-color);
        background-color: rgba(52, 116, 22, 0.37);
    }

    .glassDiv::after,
    .glassDivFortask::after {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        border-radius: 28px;
        backdrop-filter: blur(var(--frost-blur));
        filter: url(#glass-distortion);
        isolation: isolate;
        -webkit-backdrop-filter: blur(var(--frost-blur));
        -webkit-filter: url("#glass-distortion");
    }
</style>

<body class="firstPage ">
    <div class="desktop_UI">
        <section class="justify-content-center d-lg-flex d-none d-flex w-100 top-section sticky-top">
            <!-- menubar -->

            <div class="row  g-0 menubar glassDiv py-3 px-4 my-3  ">

                <!--Menu Bar Heading-->
                <div class="col-6 pe-3" style="border-right: 2px #346b40 solid;">
                    <h1 class="navfont text-start magic-growing m-0 p-0 split" style="color: #204627; cursor:pointer">
                        <a href="../index.html" style="all:unset">
                            To-Do
                        </a>
                    </h1>

                    <!--Search Bar-->
                    <div class="input-container">
                        <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="#00000088"
                            class="bi bi-search search-icon" viewBox="0 0 16 16">
                            <path
                                d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
                        </svg>
                        <input type="text" class="menuSearch " placeholder="Search your task....">
                    </div>
                </div>
                <!--Menu Icons-->
                <div class="nag menu-icons col-6  d-flex align-items-center px-4 ps-3">
                    <i class="fi fi-tr-duration pe-2 menu-icons-animation" title="Pomodoro Timer"></i>
                    <button class="theme-toggle theme-toggle--toggled  menu-icons-animation" type="button"
                        title="Toggle theme" aria-label="Toggle theme" style=" color: rgb(53, 75, 58); z-index: 50; ">
                        <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="5rem" height="5rem"
                            class="theme-toggle__eclipse" fill="currentColor" viewBox="0 0 32 32">
                            <clipPath id="theme-toggle__eclipse__cutout">
                                <path d="M0 0h64v32h-64zm36 16a1 1 0 0024 1 1 1 0 00-24-1" />
                            </clipPath>
                            <g clip-path="url(#theme-toggle__eclipse__cutout)">
                                <circle cx="16" cy="16" r="16" />
                            </g>
                        </svg>
                    </button>
                    <i class="fi fi-tr-circle-user ps-2 m-1 menu-icons-animation" title="Profile"></i>
                </div>
            </div>
        </section>
        <div class="content-wrapper   d-lg-block  d-none  align-items-center" style=" padding: 0;">


            <div class="row flex-grow-1 g-0 align-items-center">
                <div class="list-background col-md-1 ps-4 pe-4 py-3 nag">
                    <p class="listfont m-0">All tasks</p>
                    <hr>
                    <p class="listfont m-0">Personal</p>
                    <hr>
                    <p class="listfont m-0">Work</p>
                    <hr>
                    <p class="listfont m-0">Study</p>
                    <hr>
                    <p class="listfont m-0">Add(+)</p>
                </div>

                <div class="col-md-3 glassDivFortask container-fluid mx-auto me-0 task-background nag " style="">

                    <div class="row filter-task px-4 pt-4 ">

                        <button class="col-12 rounded-3 add-task p-2">Add Task</button>



                        <button class="col-2 rounded-start-3 mt-1 p-1 mx-auto filter-button" style="">all</button>
                        <button class="col-6 mt-1 mx-auto filter-button"
                            style="overflow-wrap: break-word;">completed</button>
                        <button class="col-4 rounded-end-3 mt-1 mx-auto filter-button"
                            style="border-right: 0px;">pending</button>
                        <hr style="padding-block: 0rem !important; margin-top: 0.4rem;">
                        <p style="color: rgba(0, 0, 0, 0.39); font-size: 2.5rem; font-weight: bolder;"
                            class="text-center py-4">Your added Tasks <br>
                            will be visible <br>
                            Here!</p>
                    </div>


                </div>
                <div class="col-lg-5   ms-4 task-background mx-auto calendar-Background px-3  py-3 nag">
                    <div class="wrapper d-flex align-items-center ps-4 pb-2">
                        <i class="fi fi-tr-arrow-small-left arrowPrev box left "
                            style="font-size: 1.9rem; color: rgb(234, 255, 235); cursor: pointer;"></i>
                        <h1 id="" class="box center Month-Year" style="font-weight:bolder; color: rgb(227, 255, 228);">
                        </h1>
                        <i class="fi fi-tr-arrow-small-right arrowNext box right"
                            style="font-size: 1.9rem; color: rgb(234, 255, 235); cursor: pointer;"></i>

                    </div>

                    <div class="week ">


                        <div class="d-flex justify-content-center dayForAnimation" style="color:#D97742;">Sun</div>
                        <div class="d-flex justify-content-center dayForAnimation">Mon</div>
                        <div class="d-flex justify-content-center dayForAnimation">Tue</div>
                        <div class="d-flex justify-content-center dayForAnimation">Wed</div>
                        <div class="d-flex justify-content-center dayForAnimation">Thu</div>
                        <div class="d-flex justify-content-center dayForAnimation">Fri</div>
                        <div class="d-flex justify-content-center dayForAnimation">Sat</div>
                    </div>
                    <div class="date"></div>
                </div>
            </div>
        </div>
    </div>
    <div class="mobile_UI  d-lg-none d-block  d-flex flex-column" style="min-height: 100dvh;">
        <div class="row g-0 calendar-Background mt-auto menu-icons-mobile pb-4 px-3 pt-3 " style="border-radius: 0px; margin:0px; position:sticky; bottom:0; z-index:100 ">
            <i class="fi fi-tr-duration   menu-icons-animation text-center col" title="Pomodoro Timer"></i>
            <i class="fi fi-tr-calendar menu-icons-animation text-center col"></i>
            <i class="fi fi-tr-add menu-icons-animation text-center col"></i>
            <i class="fi fi-tr-bell menu-icons-animation text-center col"></i>
            <i class="fi fi-tr-circle-user menu-icons-animation text-center col"></i>
            
        </div>


    </div>

    <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute; overflow:hidden">
        <defs>
            <filter id="glass-distortion" x="0%" y="0%" width="100%" height="100%">
                <feTurbulence type="fractalNoise" baseFrequency="0.008 0.008" numOctaves="2" seed="92" result="noise" />
                <feGaussianBlur in="noise" stdDeviation="2" result="blurred" />
                <feDisplacementMap in="SourceGraphic" in2="blurred" scale="77" xChannelSelector="R"
                    yChannelSelector="G" />
            </filter>
        </defs>
    </svg>





    <script src="https://cdn.jsdelivr.net/npm/animejs/dist/bundles/anime.umd.min.js"></script>
    <script src="mainPage.js" type="module"></script>


    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
</body>

</html>
