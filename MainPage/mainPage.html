<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do | Home</title>
    <link rel="stylesheet" href="../GlobalStyle.css">
    <link rel="stylesheet" href="mainPage.css">
    <link rel="icon" type="image/png" href="../assets/images/list.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.cdnfonts.com/css/nagaiya" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/magic-growing" rel="stylesheet">
</head>
<style>
    :root {
        /* Inner shadow */
        --shadow-offset: 0;
        --shadow-blur: 10px;
        --shadow-spread: -5px;
        --shadow-color: rgba(0, 0, 0, 0.7);

        /* Painted glass */
        --tint-color: 255, 255, 255;
        --tint-opacity: 0.1;

        /* Background frost */
        --frost-blur: 2.5px;

        /* SVG noise/distortion */
        --noise-frequency: 0.008;
        --distortion-strength: 77;

        /* Outer shadow blur */
        --outer-shadow-blur: 24px;
    }

    .glassDiv {
        position: absolute;
        border-radius: 28px;
        isolation: isolate;
        /* enable pointer dragging on touch */
        box-shadow: 0px 6px var(--outer-shadow-blur) rgba(0, 0, 0, 0.2);
    }

    .glassDiv::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 0;
        border-radius: 28px;
        box-shadow:
            inset var(--shadow-offset) var(--shadow-offset) var(--shadow-blur) var(--shadow-spread) var(--shadow-color);
        background-color: rgba(var(--tint-color), var(--tint-opacity));
    }

    .glassDiv::after {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        border-radius: 28px;
        backdrop-filter: blur(var(--frost-blur));
        filter: url(#glass-distortion);
        isolation: isolate;
        -webkit-backdrop-filter: blur(var(--frost-blur));
        -webkit-filter: url("#glass-distortion");
    }
</style>

<body class="firstPage">
    <!-- menubar -->
    <div class="row menubar glassDiv p-3 m-3 ">

        <!--Menu Bar Heading-->
        <div class="col-6 ">
            <h1 class="navfont text-start magic-growing float-start">
                To-Do
            </h1>

            <!--Search Bar-->
            <div class="input-container float-start">
                <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="#000000" class="bi bi-search "
                    viewBox="0 0 16 16" id="search-icon">
                    <path
                        d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
                </svg>
                <input type="text" class="menuSearch" placeholder="Search....">
            </div>
        </div>


        <!--Menu Icons-->
        <div class="nag col-3">

            <!--Menu Heading-->
            <p style="font-size: 1.2rem; font-weight: 900;color: rgb(0, 0, 0);">Menu</p>

        </div>
    </div>

    <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute; overflow:hidden">
        <defs>
            <filter id="glass-distortion" x="0%" y="0%" width="100%" height="100%">
                <feTurbulence type="fractalNoise" baseFrequency="0.008 0.008" numOctaves="2" seed="92" result="noise" />
                <feGaussianBlur in="noise" stdDeviation="2" result="blurred" />
                <feDisplacementMap in="SourceGraphic" in2="blurred" scale="77" xChannelSelector="R"
                    yChannelSelector="G" />
            </filter>
        </defs>
    </svg>




    <script src="https://cdn.jsdelivr.net/npm/animejs/dist/bundles/anime.umd.min.js"></script>
    <script src="mainPage.js" type="module"></script>


    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
</body>

</html>
