<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do | Home</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/theme-toggles@4.10.1/css/within.min.css" integrity="sha256-4qLHDhzuDV3IgrWCWtrSlFovj05xXNXXOjXF5Oxsg4Y=" crossorigin="anonymous">
    <link rel="stylesheet" href="../GlobalStyle.css">
    <link rel="stylesheet" href="mainPage.css">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-thin-rounded/css/uicons-thin-rounded.css'>
    <link rel="icon" type="image/png" href="../assets/images/list.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.cdnfonts.com/css/nagaiya" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/magic-growing" rel="stylesheet">
</head>
<style>
    :root {
        /* Inner shadow */
        --shadow-offset: 0;
        --shadow-blur: 10px;
        --shadow-spread: -5px;
        --shadow-color: rgba(0, 0, 0, 0.7);

        /* Painted glass */
        --tint-color: 255, 255, 255;
        --tint-opacity: 0.1;

        /* Background frost */
        --frost-blur: 2.5px;

        /* SVG noise/distortion */
        --noise-frequency: 0.008;
        --distortion-strength: 77;

        /* Outer shadow blur */
        --outer-shadow-blur: 24px;
    }

    .glassDiv {
        position: absolute;
        border-radius: 28px;
        isolation: isolate;
        /* enable pointer dragging on touch */
        box-shadow: 0px 6px var(--outer-shadow-blur) rgba(0, 0, 0, 0.2);
    }

    .glassDiv::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 0;
        border-radius: 28px;
        box-shadow:
            inset var(--shadow-offset) var(--shadow-offset) var(--shadow-blur) var(--shadow-spread) var(--shadow-color);
        background-color: rgba(var(--tint-color), var(--tint-opacity));
    }

    .glassDiv::after {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        border-radius: 28px;
        backdrop-filter: blur(var(--frost-blur));
        filter: url(#glass-distortion);
        isolation: isolate;
        -webkit-backdrop-filter: blur(var(--frost-blur));
        -webkit-filter: url("#glass-distortion");
    }
</style>

<body class="firstPage justify-content-center d-flex">

    <!-- menubar -->
    <div class="row  g-0 menubar glassDiv py-3 px-4 my-3 pe-0 me-0 ">

        <!--Menu Bar Heading-->
        <div class="col-4 pe-3" style="border-right: 2px #f5935b solid;">
            <h1 class="navfont text-start magic-growing m-0 p-0">
                To-Do
            </h1>

            <!--Search Bar-->
            <div class="input-container m-0 p-0">
                <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="#00000088" class="bi bi-search "
                    viewBox="0 0 16 16" id="search-icon">
                    <path
                        d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
                </svg>
                <input type="text" class="menuSearch" placeholder="Search....">
            </div>
        </div>
        <!--Menu Icons-->
        <div class="nag menu-icons col-8 me-0 pe-0">
            <i class="fi fi-tr-duration px-2 ps-4"></i>
            <button class="theme-toggle" type="button" title="Toggle theme" aria-label="Toggle theme"
                style="position: relative; top: -12%; ">
                <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="theme-toggle__within" height="5rem"
                    width="5rem" viewBox="0 0 32 32" fill="currentColor">
                    <clipPath id="theme-toggle__within__clip">
                        <path d="M0 0h32v32h-32ZM6 16A1 1 0 0026 16 1 1 0 006 16" />
                    </clipPath>
                    <g clip-path="url(#theme-toggle__within__clip)">
                        <path
                            d="M30.7 21.3 27.1 16l3.7-5.3c.4-.5.1-1.3-.6-1.4l-6.3-1.1-1.1-6.3c-.1-.6-.8-.9-1.4-.6L16 5l-5.4-3.7c-.5-.4-1.3-.1-1.4.6l-1 6.3-6.4 1.1c-.6.1-.9.9-.6 1.3L4.9 16l-3.7 5.3c-.4.5-.1 1.3.6 1.4l6.3 1.1 1.1 6.3c.1.6.8.9 1.4.6l5.3-3.7 5.3 3.7c.5.4 1.3.1 1.4-.6l1.1-6.3 6.3-1.1c.8-.1 1.1-.8.7-1.4zM16 25.1c-5.1 0-9.1-4.1-9.1-9.1 0-5.1 4.1-9.1 9.1-9.1s9.1 4.1 9.1 9.1c0 5.1-4 9.1-9.1 9.1z" />
                    </g>
                    <path class="theme-toggle__within__circle"
                        d="M16 7.7c-4.6 0-8.2 3.7-8.2 8.2s3.6 8.4 8.2 8.4 8.2-3.7 8.2-8.2-3.6-8.4-8.2-8.4zm0 14.4c-3.4 0-6.1-2.9-6.1-6.2s2.7-6.1 6.1-6.1c3.4 0 6.1 2.9 6.1 6.2s-2.7 6.1-6.1 6.1z" />
                    <path class="theme-toggle__within__inner"
                        d="M16 9.5c-3.6 0-6.4 2.9-6.4 6.4s2.8 6.5 6.4 6.5 6.4-2.9 6.4-6.4-2.8-6.5-6.4-6.5z" />
                </svg>
            </button>
            <i class="fi fi-tr-pen-field px-2 "></i>

            <i class="fi fi-tr-bell px-2"></i>
            <i class="fi fi-tr-duration px-2"></i>
        </div>
    </div>

    <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute; overflow:hidden">
        <defs>
            <filter id="glass-distortion" x="0%" y="0%" width="100%" height="100%">
                <feTurbulence type="fractalNoise" baseFrequency="0.008 0.008" numOctaves="2" seed="92" result="noise" />
                <feGaussianBlur in="noise" stdDeviation="2" result="blurred" />
                <feDisplacementMap in="SourceGraphic" in2="blurred" scale="77" xChannelSelector="R"
                    yChannelSelector="G" />
            </filter>
        </defs>
    </svg>





    <script src="https://cdn.jsdelivr.net/npm/animejs/dist/bundles/anime.umd.min.js"></script>
    <script src="mainPage.js" type="module"></script>


    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
</body>

</html>
