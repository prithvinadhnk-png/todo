<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

        integrity="sha256-xBmrwsmxSwonoyqTVOBISgOfgUlBmMgNZ7VneZ20SWc=" crossorigin="anonymous">
    <link rel="stylesheet" href="../GlobalStyle.css">
    <link rel="stylesheet" href="mainPage.css">
    <link rel='stylesheet' href='https://cdn-uicons.flaticon.com/3.0.0/uicons-thin-rounded/css/uicons-thin-rounded.css'>
    <link rel="icon" type="image/png" href="../assets/images/list.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

    <link href="https://fonts.cdnfonts.com/css/nagaiya" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/magic-growing" rel="stylesheet">
</head>
<style>
    :root {
        /* Inner shadow */
        --shadow-offset: 0;
        --shadow-blur: 10px;
        --shadow-spread: -5px;
        --shadow-color: rgba(0, 0, 0, 0.7);

        /* Painted glass */
        --tint-color: 255, 255, 255;
        --tint-opacity: 0.1;

        /* Background frost */
        --frost-blur: 2.5px;

        /* SVG noise/distortion */
        --noise-frequency: 0.008;
        --distortion-strength: 77;

        /* Outer shadow blur */
        --outer-shadow-blur: 24px;
    }

    .glassDiv {
        position: relative;
        border-radius: 28px;
        z-index: 1000;
        /* enable pointer dragging on touch */
        box-shadow: 0px 6px var(--outer-shadow-blur) rgba(0, 0, 0, 0.2);
    }

    .glassDiv::before {
        content: '';
        position: absolute;
        inset: 0;
        z-index: 0;
        border-radius: 28px;
        box-shadow:
            inset var(--shadow-offset) var(--shadow-offset) var(--shadow-blur) var(--shadow-spread) var(--shadow-color);
        background-color: rgba(var(--tint-color), var(--tint-opacity));
    }

    .glassDiv::after {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        border-radius: 28px;
        backdrop-filter: blur(var(--frost-blur));
        filter: url(#glass-distortion);
        isolation: isolate;
        -webkit-backdrop-filter: blur(var(--frost-blur));
        -webkit-filter: url("#glass-distortion");
    }
</style>

<body class="firstPage ">
    <section class="justify-content-center d-lg-flex d-none d-flex w-100 top-section sticky-top">
        <!-- menubar -->

        <div class="row  g-0 menubar glassDiv py-3 px-4 my-3  ">

            <!--Menu Bar Heading-->
            <div class="col-6 pe-3" style="border-right: 2px #346b40 solid;">
                <h1 class="navfont text-start magic-growing m-0 p-0 split" style="color: #204627; cursor:pointer">
                    <a href="../index.html" style="all:unset">
                        To-Do
                    </a>
                </h1>

                <!--Search Bar-->
                <div class="input-container">
                    <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" fill="#00000088" class="bi bi-search"
                        viewBox="0 0 16 16" id="search-icon">
                        <path
                            d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
                    </svg>
                    <input type="text" class="menuSearch " placeholder="Search your task....">
                </div>
            </div>
            <!--Menu Icons-->
            <div class="nag menu-icons col-6  d-flex align-items-center px-4 ps-3">
                <i class="fi fi-tr-duration pe-2 menu-icons-animation" title="Pomodoro Timer"></i>
                <button class="theme-toggle theme-toggle--toggled  menu-icons-animation" type="button"
                    title="Toggle theme" aria-label="Toggle theme" style=" color: rgb(53, 75, 58); z-index: 50; ">
                    <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" width="5rem" height="5rem"
                        class="theme-toggle__eclipse" fill="currentColor" viewBox="0 0 32 32">
                        <clipPath id="theme-toggle__eclipse__cutout">
                            <path d="M0 0h64v32h-64zm36 16a1 1 0 0024 1 1 1 0 00-24-1" />
                        </clipPath>
                        <g clip-path="url(#theme-toggle__eclipse__cutout)">
                            <circle cx="16" cy="16" r="16" />
                        </g>
                    </svg>
                </button>
                <i class="fi fi-tr-circle-user ps-2 m-1 menu-icons-animation" title="Profile"></i>
            </div>
        </div>
    </section>
    <div class="content-wrapper  d-lg-block  d-none  align-items-center" style=" padding: 0;">


        <div class="row flex-grow-1 g-0 align-items-center">

                <hr>
                <p class="listfont m-0">Work</p>
                <hr>
                <p class="listfont m-0">Study</p>
                <hr>

            </div>
            <div class="col-md-4 px-3">

            </div>
            <div class="col-md-7 pe-4">

                    this <br>
                    is <br>
                    for <br>
                    testing <br>
                    purpose <br>
                    please <br>
                    ignore <br>

                    section

            </div>
        </div>
    </div>

    <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute; overflow:hidden">
        <defs>
            <filter id="glass-distortion" x="0%" y="0%" width="100%" height="100%">
                <feTurbulence type="fractalNoise" baseFrequency="0.008 0.008" numOctaves="2" seed="92" result="noise" />
                <feGaussianBlur in="noise" stdDeviation="2" result="blurred" />
                <feDisplacementMap in="SourceGraphic" in2="blurred" scale="77" xChannelSelector="R"
                    yChannelSelector="G" />
            </filter>
        </defs>
    </svg>





    <script src="https://cdn.jsdelivr.net/npm/animejs/dist/bundles/anime.umd.min.js"></script>
