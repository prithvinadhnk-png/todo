<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>To-Do</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="assets/images/list.png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.cdnfonts.com/css/nagaiya" rel="stylesheet">
    <link href="https://fonts.cdnfonts.com/css/magic-growing" rel="stylesheet">
    


</head>

<body>

    <div class="container-fluid min-vh-100 d-flex align-items-center align-items-lg-center justify-content-center justify-content-lg-center"
        style="overflow: hidden;position: relative;">
        <div class="row w-100  g-0">
            <div class="col-12 col-lg-8">
                <img src="assets/images/HomePage.png" alt="" class="img-fluid d-block homePageimg">
            </div>
            <div class="col-12 col-lg-4 d-flex flex-column justify-content-center">
                <h1 class="text-center text-lg-start magic-growing Heading split">To-Do</h1>
                <p class="text-center text-lg-start nag para quotes splitPara">
                    Future depends on what you do today.
                </p>
                <div class="row  p-0 g-0 magic-growing  ">
                    <button class="col-12 col-lg-7 homeButton button"><a href="MainPage/mainPage.html" style="all: unset;">Start right now!</a></button>
                    <button class="col-12 col-lg-4 homeButton ms-0 ms-lg-1 mt-3 mt-lg-0 button " id="open">Sign
                        Up</button>
                </div>
            </div>
        </div>

        <div id="SignUpPopUp" class="col-11 col-lg-4 mx-5   p-4">
            <div class="d-flex justify-content-end" >
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" fill="#C84C05" class="bi bi-x "
                    viewBox="0 0 16 16" id="close">
                    <path
                        d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708" />
                </svg>
            </div>
            <div class="row g-0 justify-content-center">
                <div class="col-12 d-flex justify-content-center magic-growing ">
                    <h1 class="" style="font-size: 2.5rem !important; font-weight: bolder !important;">Sign Up</h1>
                </div>
                <form action="MainPage/mainPage.html">
                    <div class="row d-flex justify-content-center g-0">
                        <input type="text" placeholder="Enter your name" class="col-12 col-lg-7 signUpForm my-1 ">
                        <input type="email" placeholder="Enter your email" class="col-12 col-lg-7 signUpForm my-1 ">
                        <input type="password" placeholder="Enter your password"
                            class="col-12 col-lg-7 signUpForm my-1">
                        <input type="password" placeholder="Confirm your password"
                            class="col-12 col-lg-7 signUpForm my-1">
                        <button type="submit" class="col-12 col-lg-7 signUpForm my-2">Sign Up</button>
                    </div>
                </form>
            </div>
        </div>
    </div>




    <script src="https://cdn.jsdelivr.net/npm/animejs/dist/bundles/anime.umd.min.js"></script>
    <script src="script.js" type="module"></script>


    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
        integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
        integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
        crossorigin="anonymous"></script>
</body>

</html>
